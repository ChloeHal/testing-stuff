<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chat-wrapper">
    <div class="chat-center">

      <!-- User message -->
      <div class="message message-user">
        <div class="message-bubble">
          What are the main differences between quantum computing and classical computing?
        </div>
        <div class="user-avatar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
            <path d="M5 20c0-3.87 3.13-7 7-7s7 3.13 7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <!-- Bot response -->
      <div class="message message-bot">
        <div class="bot-avatar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
            <ellipse cx="12" cy="5" rx="2" ry="2.5" fill="currentColor" opacity="0.8"/>
            <ellipse cx="12" cy="19" rx="2" ry="2.5" fill="currentColor" opacity="0.8"/>
            <ellipse cx="5.5" cy="8.5" rx="2" ry="2.5" transform="rotate(-60 5.5 8.5)" fill="currentColor" opacity="0.8"/>
            <ellipse cx="18.5" cy="15.5" rx="2" ry="2.5" transform="rotate(-60 18.5 15.5)" fill="currentColor" opacity="0.8"/>
            <ellipse cx="5.5" cy="15.5" rx="2" ry="2.5" transform="rotate(60 5.5 15.5)" fill="currentColor" opacity="0.8"/>
            <ellipse cx="18.5" cy="8.5" rx="2" ry="2.5" transform="rotate(60 18.5 8.5)" fill="currentColor" opacity="0.8"/>
          </svg>
        </div>
        <div class="bot-content">
          <div class="bot-response-card">
            <div class="status-row">
              <div class="status-line" id="status-line"></div>
            </div>
            <div class="skeleton-lines">
              <div class="skeleton-line" style="width: 92%"></div>
              <div class="skeleton-line" style="width: 78%"></div>
              <div class="skeleton-line" style="width: 85%"></div>
              <div class="skeleton-line short" style="width: 45%"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Input -->
      <div class="input-area">
        <div class="input-container">
          <button class="input-icon-btn" aria-label="Attach file" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <textarea id="message-input" rows="1" placeholder="Ask anything..." disabled></textarea>
          <div class="input-actions">
            <button class="send-btn" id="send-btn" disabled aria-label="Send message">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M12 19V5m0 0-5 5m5-5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
<script src="../breadcrumb.js"></script>
</body>
</html>
