<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DNA – Flat</title>
    <link rel="stylesheet" href="style.css" />
    <style id="kf"></style>
  </head>
  <body>

    <!-- ── Controls ───────────────────────────────────── -->
    <div class="controls">
      <div class="pause-btns">
        <button onclick="togglePlay()" id="btn-play">Pause</button>
        <button onclick="pauseAt(0)" id="btn-0">0°</button>
        <button onclick="pauseAt(90)" id="btn-90">90°</button>
      </div>
      <div class="control">
        <label>Brins</label>
        <input type="range" min="3" max="9" value="5" oninput="setRungs(+this.value, this)">
        <span class="val">5</span>
      </div>
      <div class="control">
        <label>Boules</label>
        <input type="range" min="8" max="32" value="18" oninput="setVar('--ball-size',this.value+'px',this)">
        <span class="val">18px</span>
      </div>
      <div class="control">
        <label>Épaisseur</label>
        <input type="range" min="0" max="8" value="2" step="0.5" oninput="setVar('--rod-height',this.value+'px',this)">
        <span class="val">2px</span>
      </div>
      <div class="control">
        <label>Longueur</label>
        <input type="range" min="40" max="140" value="80" oninput="setVar('--rod-length',this.value+'px',this)">
        <span class="val">80px</span>
      </div>
      <div class="control">
        <label>Espacement</label>
        <input type="range" min="12" max="48" value="24" oninput="setVar('--spacing',this.value+'px',this)">
        <span class="val">24px</span>
      </div>
      <div class="control">
        <label>Perspective</label>
        <input type="range" min="75" max="750" value="400" oninput="setVar('--perspective',this.value+'px',this)">
        <span class="val">400px</span>
      </div>
    </div>

    <!-- ── DNA ────────────────────────────────────────── -->
    <div class="scene">
      <div class="dna" id="dna"></div>
    </div>

    <!-- ── Icon preview ────────────────────────────────── -->
    <div class="scene" id="icon-scene" style="transform: scale(0.3); transform-origin: center center;">
      <div class="dna" id="dna-icon"></div>
    </div>
    <div class="control">
      <label>Échelle icône</label>
      <input type="range" min="10" max="100" value="30" oninput="setIconScale(this.value)">
      <span class="val" id="icon-scale-val">30%</span>
    </div>

    <script src="script.js"></script>
  </body>
</html>
