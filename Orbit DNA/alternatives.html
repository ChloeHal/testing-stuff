<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DNA – Flat</title>
    <style>
      :root {
        --ball-size: 18px;
        --rod-height: 2px;
        --rod-length: 80px;
        --spacing: 24px;
        --perspective: 400px;
      }

      body {
        margin: 0;
        background: #FFF;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        padding: 24px 0;
      }

      /* ── Controls ──────────────────────────────────── */
      .controls {
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }

      .control {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .control label {
        font-size: 10px;
        color: #71717a;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
      }

      .control input[type="range"] { width: 100px; }

      .control .val {
        font-size: 11px;
        color: #18181b;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      .pause-btns { display: flex; gap: 6px; }
      .pause-btns button {
        padding: 4px 12px;
        border: 1px solid #e4e4e7;
        border-radius: 6px;
        background: #fafafa;
        font-size: 11px;
        font-weight: 600;
        color: #18181b;
        cursor: pointer;
        font-family: inherit;
      }
      .pause-btns button:hover { background: #f4f4f5; }
      .pause-btns button.active { background: #18181b; color: #fff; border-color: #18181b; }

      /* ── Base DNA ──────────────────────────────────── */
      .scene {
        perspective: none;
        display: flex; align-items: center; justify-content: center;
        width: 200px; height: 200px;
        background: black; border-radius: 20%;
      }

      .dna { position: relative; transform-style: preserve-3d; }

      .rung {
        position: absolute;
        transform-style: preserve-3d;
        translate: 0 calc(var(--mult) * var(--spacing)) 0;
        animation: spin 6s linear infinite;
        animation-delay: var(--delay);
      }

      .rod {
        position: absolute;
        width: var(--rod-length);
        height: var(--rod-height);
        background: #FFF;
        border-radius: 1px;
        opacity: 1;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%) rotateY(90deg);
      }

      .ball {
        position: absolute;
        border-radius: 50%;
        width: var(--ball-size);
        aspect-ratio: 1;
        left: 50%; top: 50%;
        background: #FFF;
        box-shadow: none;
      }

      .ball-a {
        animation: flat-a 6s linear infinite;
        animation-delay: var(--delay);
      }

      .ball-b {
        animation: flat-b 6s linear infinite;
        animation-delay: var(--delay);
      }

      @keyframes spin {
        from { transform: rotateY(0deg); }
        to   { transform: rotateY(360deg); }
      }

      /* flat-a, flat-b: generated by JS */

      /* Pause */
      .paused .rung,
      .paused .ball { animation-play-state: paused !important; }

      /* Reset (used during pause-at transition) */
      .reset-anim .rung,
      .reset-anim .ball { animation: none !important; }
    </style>
    <style id="kf"></style>
  </head>
  <body>

    <!-- ── Controls ───────────────────────────────────── -->
    <div class="controls">
      <div class="pause-btns">
        <button onclick="play()" id="btn-play" class="active">Play</button>
        <button onclick="pauseAt(0)" id="btn-0">0°</button>
        <button onclick="pauseAt(90)" id="btn-90">90°</button>
      </div>
      <div class="control">
        <label>Brins</label>
        <input type="range" min="3" max="9" value="5" oninput="setRungs(+this.value, this)">
        <span class="val">5</span>
      </div>
      <div class="control">
        <label>Boules</label>
        <input type="range" min="8" max="32" value="18" oninput="setVar('--ball-size',this.value+'px',this)">
        <span class="val">18px</span>
      </div>
      <div class="control">
        <label>Épaisseur</label>
        <input type="range" min="1" max="8" value="2" step="0.5" oninput="setVar('--rod-height',this.value+'px',this)">
        <span class="val">2px</span>
      </div>
      <div class="control">
        <label>Longueur</label>
        <input type="range" min="40" max="140" value="80" oninput="setVar('--rod-length',this.value+'px',this)">
        <span class="val">80px</span>
      </div>
      <div class="control">
        <label>Espacement</label>
        <input type="range" min="12" max="48" value="24" oninput="setVar('--spacing',this.value+'px',this)">
        <span class="val">24px</span>
      </div>
      <div class="control">
        <label>Perspective</label>
        <input type="range" min="80" max="1500" value="400" oninput="setVar('--perspective',this.value+'px',this)">
        <span class="val">400px</span>
      </div>
    </div>

    <!-- ── DNA ────────────────────────────────────────── -->
    <div class="scene">
      <div class="dna" id="dna"></div>
    </div>

    <script>
      const DURATION = 6;
      let currentPauseAngle = null; // null = playing

      /* ── Build rung elements ─────────────────────────── */
      function buildRungs(count) {
        const dna = document.getElementById('dna');
        dna.innerHTML = '';
        const step = 180 / (count - 1);

        for (let i = 0; i < count; i++) {
          const k = i - (count - 1) / 2;          // position from center
          const angle = k * step;                   // helical twist angle
          const delay = -(angle / 360) * DURATION;  // animation delay

          const rung = document.createElement('div');
          rung.className = 'rung';
          rung.dataset.base = delay.toFixed(4);
          rung.style.setProperty('--mult', k);
          rung.style.setProperty('--delay', delay.toFixed(4) + 's');
          rung.innerHTML = '<div class="rod"></div><div class="ball ball-a"></div><div class="ball ball-b"></div>';
          dna.appendChild(rung);
        }

        // Re-apply pause if needed
        if (currentPauseAngle !== null) {
          pauseAt(currentPauseAngle);
        }
      }

      /* ── Generate @keyframes with hardcoded px ────────── */
      function buildKeyframes() {
        const rod = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rod-length'));
        const p   = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--perspective'));
        const h   = rod / 2;

        const sFront = p / (p - h);
        const sBack  = p / (p + h);

        document.getElementById('kf').textContent = `
          @keyframes flat-a {
            0%   { transform: translate(-50%,-50%) translateZ(${h}px) rotateY(0deg)    scale(${sFront.toFixed(4)}); }
            25%  { transform: translate(-50%,-50%) translateZ(${h}px) rotateY(-90deg)  scale(1); }
            50%  { transform: translate(-50%,-50%) translateZ(${h}px) rotateY(-180deg) scale(${sBack.toFixed(4)}); }
            75%  { transform: translate(-50%,-50%) translateZ(${h}px) rotateY(-270deg) scale(1); }
            100% { transform: translate(-50%,-50%) translateZ(${h}px) rotateY(-360deg) scale(${sFront.toFixed(4)}); }
          }
          @keyframes flat-b {
            0%   { transform: translate(-50%,-50%) translateZ(${-h}px) rotateY(0deg)    scale(${sBack.toFixed(4)}); }
            25%  { transform: translate(-50%,-50%) translateZ(${-h}px) rotateY(-90deg)  scale(1); }
            50%  { transform: translate(-50%,-50%) translateZ(${-h}px) rotateY(-180deg) scale(${sFront.toFixed(4)}); }
            75%  { transform: translate(-50%,-50%) translateZ(${-h}px) rotateY(-270deg) scale(1); }
            100% { transform: translate(-50%,-50%) translateZ(${-h}px) rotateY(-360deg) scale(${sBack.toFixed(4)}); }
          }
        `;
      }

      /* ── Slider handlers ─────────────────────────────── */
      function setVar(name, value, input) {
        document.documentElement.style.setProperty(name, value);
        input.closest('.control').querySelector('.val').textContent = value;
        if (name === '--rod-length' || name === '--perspective') buildKeyframes();
      }

      function setRungs(count, input) {
        input.closest('.control').querySelector('.val').textContent = count;
        buildRungs(count);
      }

      /* ── Pause / Play ───────────────────────────────── */
      function setActiveBtn(id) {
        document.querySelectorAll('.pause-btns button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
      }

      function play() {
        currentPauseAngle = null;
        document.querySelectorAll('.rung').forEach(rung => {
          rung.style.setProperty('--delay', rung.dataset.base + 's');
        });
        document.body.classList.add('reset-anim');
        void document.body.offsetWidth;
        document.body.classList.remove('reset-anim');
        document.querySelector('.scene').classList.remove('paused');
        setActiveBtn('btn-play');
      }

      function pauseAt(angle) {
        currentPauseAngle = angle;
        const shift = -(angle / 360) * DURATION;
        document.querySelectorAll('.rung').forEach(rung => {
          const base = parseFloat(rung.dataset.base);
          rung.style.setProperty('--delay', (base + shift) + 's');
        });
        document.body.classList.add('reset-anim');
        document.querySelector('.scene').classList.remove('paused');
        void document.body.offsetWidth;
        document.body.classList.remove('reset-anim');
        requestAnimationFrame(() => {
          document.querySelector('.scene').classList.add('paused');
        });
        setActiveBtn('btn-' + angle);
      }

      /* ── Init ────────────────────────────────────────── */
      buildKeyframes();
      buildRungs(5);
    </script>
  </body>
</html>
