<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DNA – Alternatives</title>
    <style>
      :root {
        --ball-size: 18px;
        --rod-height: 2px;
        --rod-length: 80px;
        --spacing: 24px;
        --perspective: 800px;
      }

      body {
        margin: 0;
        background: #FFF;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        padding: 24px 0;
      }

      /* ── Controls ──────────────────────────────────── */
      .controls {
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }

      .control {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .control label {
        font-size: 10px;
        color: #71717a;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
      }

      .control input[type="range"] { width: 100px; }

      .control .val {
        font-size: 11px;
        color: #18181b;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      .pause-btns { display: flex; gap: 6px; }
      .pause-btns button {
        padding: 4px 12px;
        border: 1px solid #e4e4e7;
        border-radius: 6px;
        background: #fafafa;
        font-size: 11px;
        font-weight: 600;
        color: #18181b;
        cursor: pointer;
        font-family: inherit;
      }
      .pause-btns button:hover { background: #f4f4f5; }
      .pause-btns button.active { background: #18181b; color: #fff; border-color: #18181b; }

      /* ── Layout ────────────────────────────────────── */
      .row { display: flex; align-items: center; gap: 40px; }

      .variant {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .variant-label {
        font-size: 11px;
        font-weight: 600;
        color: #71717a;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .variant.icon .scene {
        transform: scale(0.375);
        margin: -62px;
      }

      /* ── Base DNA ──────────────────────────────────── */
      .scene {
        perspective: var(--perspective);
        display: flex; align-items: center; justify-content: center;
        width: 200px; height: 200px;
        background: black; border-radius: 20%;
      }

      .dna { position: relative; transform-style: preserve-3d; }

      .rung {
        position: absolute;
        transform-style: preserve-3d;
        translate: 0 calc(var(--mult) * var(--spacing)) 0;
        animation: spin 6s linear infinite;
        animation-delay: var(--delay);
      }

      .rod {
        position: absolute;
        width: var(--rod-length);
        height: var(--rod-height);
        background: #FFF;
        border-radius: 1px;
        opacity: 1;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%) rotateY(90deg);
      }

      .ball {
        position: absolute;
        border-radius: 50%;
        width: var(--ball-size);
        aspect-ratio: 1;
        left: 50%; top: 50%;
        background: #FFF;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      }

      .ball-a {
        animation: orbit-a 6s linear infinite;
        animation-delay: var(--delay);
      }

      .ball-b {
        animation: orbit-b 6s linear infinite;
        animation-delay: var(--delay);
      }

      @keyframes spin {
        from { transform: rotateY(0deg); }
        to   { transform: rotateY(360deg); }
      }

      @keyframes orbit-a {
        from { transform: translate(-50%,-50%) translateZ(calc(var(--rod-length) / 2)) rotateY(0deg); }
        to   { transform: translate(-50%,-50%) translateZ(calc(var(--rod-length) / 2)) rotateY(-360deg); }
      }

      @keyframes orbit-b {
        from { transform: translate(-50%,-50%) translateZ(calc(var(--rod-length) / -2)) rotateY(0deg); }
        to   { transform: translate(-50%,-50%) translateZ(calc(var(--rod-length) / -2)) rotateY(-360deg); }
      }

      /* Pause */
      .paused .rung,
      .paused .ball { animation-play-state: paused !important; }

      /* Reset (used during pause-at transition) */
      .reset-anim .rung,
      .reset-anim .ball { animation: none !important; }

      /* ══ 1. ORIGINAL ═══════════════════════════════ */
      /* (base styles, no overrides) */

      /* ══ 2. MULTI-BALLS ════════════════════════════ */
      .multi .rod { width: calc(var(--rod-length) * 1.125); }
      .multi .ball { box-shadow: none; }

      .multi .ball-a1 { width: var(--ball-size); animation: m-orbit-a1 6s linear infinite; animation-delay: var(--delay); }
      .multi .ball-a2 { width: calc(var(--ball-size) * 0.55); animation: m-orbit-a2 6s linear infinite; animation-delay: var(--delay); }
      .multi .ball-a3 { width: calc(var(--ball-size) * 0.33); animation: m-orbit-a3 6s linear infinite; animation-delay: var(--delay); }

      .multi .ball-b1 { width: var(--ball-size); animation: m-orbit-b1 6s linear infinite; animation-delay: var(--delay); }
      .multi .ball-b2 { width: calc(var(--ball-size) * 0.55); animation: m-orbit-b2 6s linear infinite; animation-delay: var(--delay); }
      .multi .ball-b3 { width: calc(var(--ball-size) * 0.33); animation: m-orbit-b3 6s linear infinite; animation-delay: var(--delay); }

      @keyframes m-orbit-a1 {
        from { transform: translate(-50%,-50%) translateZ(calc(var(--rod-length) * 0.5)) rotateY(0deg); }
        to   { transform: translate(-50%,-50%) translateZ(calc(var(--rod-length) * 0.5)) rotateY(-360deg); }
      }
      @keyframes m-orbit-b1 {
        from { transform: translate(-50%,-50%) translateZ(calc(var(--rod-length) * -0.5)) rotateY(0deg); }
        to   { transform: translate(-50%,-50%) translateZ(calc(var(--rod-length) * -0.5)) rotateY(-360deg); }
      }
      @keyframes m-orbit-a2 {
        from { transform: translate(-50%,-50%) translateZ(calc(var(--rod-length) * 0.31)) rotateY(0deg); }
        to   { transform: translate(-50%,-50%) translateZ(calc(var(--rod-length) * 0.31)) rotateY(-360deg); }
      }
      @keyframes m-orbit-b2 {
        from { transform: translate(-50%,-50%) translateZ(calc(var(--rod-length) * -0.31)) rotateY(0deg); }
        to   { transform: translate(-50%,-50%) translateZ(calc(var(--rod-length) * -0.31)) rotateY(-360deg); }
      }
      @keyframes m-orbit-a3 {
        from { transform: translate(-50%,-50%) translateZ(calc(var(--rod-length) * 0.16)) rotateY(0deg); }
        to   { transform: translate(-50%,-50%) translateZ(calc(var(--rod-length) * 0.16)) rotateY(-360deg); }
      }
      @keyframes m-orbit-b3 {
        from { transform: translate(-50%,-50%) translateZ(calc(var(--rod-length) * -0.16)) rotateY(0deg); }
        to   { transform: translate(-50%,-50%) translateZ(calc(var(--rod-length) * -0.16)) rotateY(-360deg); }
      }

      /* ══ 3. DEPTH FADE ═════════════════════════════ */
      .depth .ball-a {
        animation: orbit-a 6s linear infinite, fade-front 6s linear infinite;
        animation-delay: var(--delay), var(--delay);
      }
      .depth .ball-b {
        animation: orbit-b 6s linear infinite, fade-back 6s linear infinite;
        animation-delay: var(--delay), var(--delay);
      }

      @keyframes fade-front {
        0%, 100% { opacity: 1; } 50% { opacity: 0.15; }
      }
      @keyframes fade-back {
        0%, 100% { opacity: 0.15; } 50% { opacity: 1; }
      }

      /* ══ 4. THICK BARS ═════════════════════════════ */
      .thick .rod { height: calc(var(--rod-height) + 3px); }

      /* ══ 5. STRONG DEPTH ════════════════════════════ */
      .persp { perspective: calc(var(--perspective) * 0.35); }

      /* ══ 6. UNIFORM (no depth) ════════════════════ */
      .uniform { perspective: none; }
      .uniform .rung { perspective: var(--perspective); }
    </style>
  </head>

            <div class="rung" data-base="-4.5" style="--mult:-2;--delay:-4.5s"><div class="rod"></div><div class="ball ball-a"></div><div class="ball ball-b"></div></div>
            <div class="rung" data-base="-5.25" style="--mult:-1;--delay:-5.25s"><div class="rod"></div><div class="ball ball-a"></div><div class="ball ball-b"></div></div>
            <div class="rung" data-base="0" style="--mult:0;--delay:0s"><div class="rod"></div><div class="ball ball-a"></div><div class="ball ball-b"></div></div>
            <div class="rung" data-base="-0.75" style="--mult:1;--delay:-0.75s"><div class="rod"></div><div class="ball ball-a"></div><div class="ball ball-b"></div></div>
            <div class="rung" data-base="-1.5" style="--mult:2;--delay:-1.5s"><div class="rod"></div><div class="ball ball-a"></div><div class="ball ball-b"></div></div>
          </div>
        </div>
      </div>

    </div><!-- /row icons -->

    <script>
      const DURATION = 6;

      function setVar(name, value, input) {
        document.documentElement.style.setProperty(name, value);
        input.closest('.control').querySelector('.val').textContent = value;
      }

      function setActiveBtn(id) {
        document.querySelectorAll('.pause-btns button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
      }

      function play() {
        // Restore base delays
        document.querySelectorAll('.rung').forEach(rung => {
          rung.style.setProperty('--delay', rung.dataset.base + 's');
        });
        // Reset animations then unpause
        document.body.classList.add('reset-anim');
        void document.body.offsetWidth;
        document.body.classList.remove('reset-anim');
        document.querySelectorAll('.scene').forEach(s => s.classList.remove('paused'));
        setActiveBtn('btn-play');
      }

      function pauseAt(angle) {
        const shift = -(angle / 360) * DURATION;
        // Update delays with shift
        document.querySelectorAll('.rung').forEach(rung => {
          const base = parseFloat(rung.dataset.base);
          rung.style.setProperty('--delay', (base + shift) + 's');
        });
        // Reset animations, reflow, then pause
        document.body.classList.add('reset-anim');
        document.querySelectorAll('.scene').forEach(s => s.classList.remove('paused'));
        void document.body.offsetWidth;
        document.body.classList.remove('reset-anim');
        requestAnimationFrame(() => {
          document.querySelectorAll('.scene').forEach(s => s.classList.add('paused'));
        });
        setActiveBtn('btn-' + angle);
      }
    </script>
  </body>
</html>
