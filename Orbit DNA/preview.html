<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit DNA</title>
    <link rel="stylesheet" href="style-DNA.css" />
    <style>
      body {
        margin: 0;
        background: #FFF;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="dna">
        <div class="rung" style="--y: -48px; --delay: -4.5s">
          <div class="rod"></div>
          <div class="ball ball-a"></div>
          <div class="ball ball-b"></div>
        </div>
        <div class="rung" style="--y: -24px; --delay: -5.25s">
          <div class="rod"></div>
          <div class="ball ball-a"></div>
          <div class="ball ball-b"></div>
        </div>
        <div class="rung" style="--y: 0px; --delay: 0s">
          <div class="rod"></div>
          <div class="ball ball-a"></div>
          <div class="ball ball-b"></div>
        </div>
        <div class="rung" style="--y: 24px; --delay: -0.75s">
          <div class="rod"></div>
          <div class="ball ball-a"></div>
          <div class="ball ball-b"></div>
        </div>
        <div class="rung" style="--y: 48px; --delay: -1.5s">
          <div class="rod"></div>
          <div class="ball ball-a"></div>
          <div class="ball ball-b"></div>
        </div>
      </div>
    </div>
  </body>
</html>
