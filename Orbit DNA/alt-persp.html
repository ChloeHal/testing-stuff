<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DNA – Strong perspective</title>
    <style>
      body { margin: 0; background: #FFF; display: flex; align-items: center; justify-content: center; height: 100vh; }

      .scene {
        perspective: 250px;
        display: flex; align-items: center; justify-content: center;
        width: 200px; height: 200px;
        background: black; border-radius: 20%;
      }
      .dna { position: relative; transform-style: preserve-3d; }

      .rung {
        position: absolute; transform-style: preserve-3d;
        translate: 0 var(--y) 0;
        animation: spin 6s linear infinite;
        animation-delay: var(--delay);
      }

      .rod {
        position: absolute; width: 80px; height: 2px;
        background: #FFF; border-radius: 1px; opacity: 0.6;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%) rotateY(90deg);
      }

      .ball {
        position: absolute; width: 18px; height: 18px;
        border-radius: 50%; left: 50%; top: 50%;
        background: #FFF;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      }

      .ball-a {
        animation: counter-spin-a 6s linear infinite;
        animation-delay: var(--delay);
      }
      .ball-b {
        animation: counter-spin-b 6s linear infinite;
        animation-delay: var(--delay);
      }

      @keyframes spin {
        from { transform: rotateY(0deg); }
        to   { transform: rotateY(360deg); }
      }
      @keyframes counter-spin-a {
        from { transform: translate(-50%,-50%) translateZ(40px) rotateY(0deg); }
        to   { transform: translate(-50%,-50%) translateZ(40px) rotateY(-360deg); }
      }
      @keyframes counter-spin-b {
        from { transform: translate(-50%,-50%) translateZ(-40px) rotateY(0deg); }
        to   { transform: translate(-50%,-50%) translateZ(-40px) rotateY(-360deg); }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="dna">
        <div class="rung" style="--y: -48px; --delay: -4.5s">
          <div class="rod"></div>
          <div class="ball ball-a"></div>
          <div class="ball ball-b"></div>
        </div>
        <div class="rung" style="--y: -24px; --delay: -5.25s">
          <div class="rod"></div>
          <div class="ball ball-a"></div>
          <div class="ball ball-b"></div>
        </div>
        <div class="rung" style="--y: 0px; --delay: 0s">
          <div class="rod"></div>
          <div class="ball ball-a"></div>
          <div class="ball ball-b"></div>
        </div>
        <div class="rung" style="--y: 24px; --delay: -0.75s">
          <div class="rod"></div>
          <div class="ball ball-a"></div>
          <div class="ball ball-b"></div>
        </div>
        <div class="rung" style="--y: 48px; --delay: -1.5s">
          <div class="rod"></div>
          <div class="ball ball-a"></div>
          <div class="ball ball-b"></div>
        </div>
      </div>
    </div>
  </body>
</html>
