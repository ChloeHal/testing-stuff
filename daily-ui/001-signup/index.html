<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily UI #001 — Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      /* Grid system */
      --cols: 12;
      --col-gap: 20px;
      --margin: 80px;
      --grid-max: 1200px;
      --col-color: rgba(255, 59, 48, 0.06);
      --baseline: 8px;
      --baseline-color: rgba(0, 122, 255, 0.04);
      --label-color: rgba(255, 59, 48, 0.35);

      /* Liquid Glass — no gradients */
      --bg: #e8e4e0;
      --glass-bg: rgba(255,255,255,0.32);
      --glass-border: rgba(255,255,255,0.60);
      --glass-border-top: rgba(255,255,255,0.80);
      --glass-border-bottom: rgba(0,0,0,0.03);
      --glass-shadow:
        0 0 0 0.5px rgba(255,255,255,0.5),
        0 1px 1px rgba(0,0,0,0.02),
        0 4px 8px rgba(0,0,0,0.03),
        0 16px 40px rgba(0,0,0,0.05),
        inset 0 0.5px 0 rgba(255,255,255,0.7);

      --clear-bg: rgba(255,255,255,0.45);
      --clear-border: rgba(255,255,255,0.65);
      --clear-shadow: inset 0 0.5px 0 rgba(255,255,255,0.7), 0 1px 2px rgba(0,0,0,0.03);

      --active-bg: rgba(0,0,0,0.72);
      --active-border: rgba(255,255,255,0.06);
      --active-text: #fff;

      --text: #1a1a1a;
      --text-secondary: rgba(0,0,0,0.48);
      --text-tertiary: rgba(0,0,0,0.25);
      --link: rgba(0,0,0,0.55);
      --link-hover: #000;
      --divider: rgba(0,0,0,0.05);
      --focus-ring: rgba(0,122,255,0.20);
      --focus-border: rgba(0,122,255,0.45);

      --avatar-text: rgba(0,0,0,0.45);
      --blob-1: rgba(139,92,246,0.20);
      --blob-2: rgba(251,113,133,0.15);
      --blob-3: rgba(56,189,248,0.13);
      --blob-4: rgba(250,204,21,0.10);

      --theme-btn-bg: rgba(255,255,255,0.40);
      --theme-btn-border: rgba(255,255,255,0.60);
      --theme-btn-hover: rgba(255,255,255,0.60);
      --theme-btn-color: rgba(0,0,0,0.35);
    }

    [data-theme="dark"] {
      --col-color: rgba(255, 59, 48, 0.04);
      --baseline-color: rgba(0, 122, 255, 0.03);
      --label-color: rgba(255, 59, 48, 0.22);
      --bg: #111113;
      --glass-bg: rgba(255,255,255,0.05);
      --glass-border: rgba(255,255,255,0.08);
      --glass-border-top: rgba(255,255,255,0.12);
      --glass-border-bottom: rgba(255,255,255,0.03);
      --glass-shadow:
        0 0 0 0.5px rgba(255,255,255,0.06),
        0 1px 1px rgba(0,0,0,0.1),
        0 4px 8px rgba(0,0,0,0.1),
        0 16px 40px rgba(0,0,0,0.18),
        inset 0 0.5px 0 rgba(255,255,255,0.06);

      --clear-bg: rgba(255,255,255,0.04);
      --clear-border: rgba(255,255,255,0.07);
      --clear-shadow: inset 0 0.5px 0 rgba(255,255,255,0.04), 0 1px 2px rgba(0,0,0,0.12);

      --active-bg: rgba(255,255,255,0.13);
      --active-border: rgba(255,255,255,0.10);
      --active-text: #fff;

      --text: #f2f2f2;
      --text-secondary: rgba(255,255,255,0.48);
      --text-tertiary: rgba(255,255,255,0.20);
      --link: rgba(255,255,255,0.55);
      --link-hover: #fff;
      --divider: rgba(255,255,255,0.05);
      --focus-ring: rgba(50,140,255,0.12);
      --focus-border: rgba(50,140,255,0.42);

      --avatar-text: rgba(255,255,255,0.4);
      --blob-1: rgba(139,92,246,0.24);
      --blob-2: rgba(251,113,133,0.17);
      --blob-3: rgba(56,189,248,0.14);
      --blob-4: rgba(250,204,21,0.08);

      --theme-btn-bg: rgba(255,255,255,0.04);
      --theme-btn-border: rgba(255,255,255,0.07);
      --theme-btn-hover: rgba(255,255,255,0.08);
      --theme-btn-color: rgba(255,255,255,0.30);
    }

    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      min-height: 100vh;
      background: var(--bg);
      overflow: hidden;
      transition: background 0.4s;
      -webkit-font-smoothing: antialiased;
    }

    /* ══════════════════════════════════════
       FIGMA-STYLE DESIGN GRID
    ══════════════════════════════════════ */

    /* The grid-overlay is both the visual grid AND the layout container */
    .grid-overlay {
      position: fixed; inset: 0; z-index: 1;
      display: flex;
      justify-content: center;
      pointer-events: none; /* columns don't block clicks */
    }

    .grid-container {
      width: 100%;
      max-width: var(--grid-max);
      margin: 0 var(--margin);
      position: relative;
      display: grid;
      grid-template-columns: repeat(var(--cols), 1fr);
      grid-template-rows: 1fr;
      gap: 0 var(--col-gap);
      align-items: center;
    }

    .grid-col {
      background: var(--col-color);
      position: relative;
      height: 100%;
    }

    /* Column number labels */
    .grid-col::before {
      content: attr(data-col);
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 500;
      color: var(--label-color);
      line-height: 1;
    }

    /* Baseline horizontal rows */
    .grid-baseline {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
      background-image: repeating-linear-gradient(
        0deg,
        var(--baseline-color) 0px,
        var(--baseline-color) 1px,
        transparent 1px,
        transparent var(--baseline)
      );
    }

    /* Margin indicators */
    .grid-margin-left,
    .grid-margin-right {
      position: fixed;
      top: 0; bottom: 0;
      width: var(--margin);
      z-index: 0;
      pointer-events: none;
      border-style: solid;
      border-color: rgba(255, 59, 48, 0.08);
      border-width: 0;
    }
    .grid-margin-left {
      left: 0;
      border-right-width: 1px;
    }
    .grid-margin-right {
      right: 0;
      border-left-width: 1px;
    }

    /* ── Blobs (flat colors, no gradients) ── */
    .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .blob {
      position: absolute; border-radius: 50%;
      filter: blur(90px);
      will-change: transform;
      transition: background 0.4s;
    }
    .blob-1 { width: 500px; height: 500px; background: var(--blob-1); top: -12%; left: -6%; animation: d1 20s ease-in-out infinite; }
    .blob-2 { width: 420px; height: 420px; background: var(--blob-2); bottom: -10%; right: -7%; animation: d2 24s ease-in-out infinite; }
    .blob-3 { width: 340px; height: 340px; background: var(--blob-3); top: 35%; left: 58%; animation: d3 17s ease-in-out infinite; }
    .blob-4 { width: 260px; height: 260px; background: var(--blob-4); top: 62%; left: 12%; animation: d4 22s ease-in-out infinite; }
    @keyframes d1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(65px,35px) scale(1.06)} }
    @keyframes d2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-50px,-20px) scale(1.1)} }
    @keyframes d3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-35px,25px) scale(0.9)} }
    @keyframes d4 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(30px,-30px) scale(1.07)} }

    /* ── Theme toggle ── */
    .theme-toggle {
      position: fixed; top: 1.2rem; right: 1.2rem; z-index: 10;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--theme-btn-border);
      background: var(--theme-btn-bg);
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      box-shadow: var(--clear-shadow);
      color: var(--theme-btn-color);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s;
    }
    .theme-toggle:hover { background: var(--theme-btn-hover); }
    .theme-toggle svg { width: 14px; height: 14px; }
    .theme-toggle .icon-moon { display: none; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: none; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: block; }

    /* ══════════════════════════════════════
       LIQUID GLASS CARD — aligned to cols 4-9
       Width = 6/12 of grid = 50%
    ══════════════════════════════════════ */
    .card {
      /* Placed in the grid via JS: grid-column 4 / 10 (cols 4-9) */
      position: relative; z-index: 2;
      pointer-events: auto; /* re-enable clicks inside card */
      padding: 32px var(--col-gap) 24px;
      border-radius: 20px;
      backdrop-filter: blur(50px) saturate(1.8);
      -webkit-backdrop-filter: blur(50px) saturate(1.8);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-top-color: var(--glass-border-top);
      border-bottom-color: var(--glass-border-bottom);
      box-shadow: var(--glass-shadow);
      transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;
    }

    /* Top specular line — flat, no gradient */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: var(--glass-border-top);
      opacity: 0.6;
      pointer-events: none;
    }

    /* ── Avatar ── */
    .avatar-area {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 20px; /* 2.5 × baseline */
      position: relative; z-index: 1;
    }

    .avatar {
      width: 64px; height: 64px; /* 8 × baseline */
      border-radius: 16px;
      background: var(--clear-bg);
      border: 1px solid var(--clear-border);
      border-top-color: var(--glass-border-top);
      border-bottom-color: var(--glass-border-bottom);
      backdrop-filter: blur(20px) saturate(1.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      box-shadow: var(--clear-shadow);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 8px; /* 1 × baseline */
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .avatar::before {
      content: '';
      position: absolute;
      top: 0; left: 15%; right: 15%; height: 1px;
      background: var(--clear-border);
      opacity: 0.5;
      pointer-events: none;
    }

    .avatar.has-initials { transform: scale(1.06); }

    .avatar-placeholder { color: var(--text-tertiary); transition: opacity 0.3s; }
    .avatar-placeholder svg { width: 24px; height: 24px; }

    .avatar-initials {
      font-size: 1.2rem; font-weight: 600;
      color: var(--avatar-text);
      letter-spacing: 0.02em;
      position: relative; z-index: 1;
      opacity: 0; transform: scale(0.5);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .avatar.has-initials .avatar-initials { opacity: 1; transform: scale(1); }
    .avatar.has-initials .avatar-placeholder { opacity: 0; position: absolute; }

    .avatar-label {
      font-size: 0.68rem; font-weight: 500;
      color: var(--text-tertiary);
      transition: all 0.3s; height: 16px; /* 2 × baseline */
      line-height: 16px;
    }
    .avatar-label.active { color: var(--text-secondary); }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 24px; /* 3 × baseline */
      position: relative; z-index: 1;
    }
    .header h1 {
      font-size: 1.28rem; font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }
    .header p { font-size: 0.76rem; color: var(--text-secondary); }
    .header p a { color: var(--link); text-decoration: none; transition: color 0.2s; }
    .header p a:hover { color: var(--link-hover); }

    /* ── Social row ── */
    .social-row {
      display: flex; gap: var(--col-gap);
      margin-bottom: 16px; /* 2 × baseline */
      position: relative; z-index: 1;
    }

    .social-btn {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      gap: 6px;
      height: 40px; /* 5 × baseline */
      border-radius: 10px;
      border: 1px solid var(--clear-border);
      border-top-color: var(--glass-border-top);
      border-bottom-color: var(--glass-border-bottom);
      background: var(--clear-bg);
      backdrop-filter: blur(16px) saturate(1.4);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      box-shadow: var(--clear-shadow);
      color: var(--text-secondary);
      font-size: 0.76rem; font-weight: 500; font-family: inherit;
      cursor: pointer; transition: all 0.2s;
      position: relative;
    }
    .social-btn::before {
      content: '';
      position: absolute;
      top: 0; left: 18%; right: 18%; height: 1px;
      background: var(--clear-border);
      opacity: 0.4;
      pointer-events: none;
    }
    .social-btn:hover { background: rgba(255,255,255,0.55); }
    [data-theme="dark"] .social-btn:hover { background: rgba(255,255,255,0.07); }
    .social-btn svg { width: 15px; height: 15px; flex-shrink: 0; position: relative; z-index: 1; }
    .social-btn span { position: relative; z-index: 1; }

    /* ── Divider ── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px; /* 2 × baseline */
      position: relative; z-index: 1;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--divider); }
    .divider span { font-size: 0.62rem; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.1em; }

    /* ── Fields ── */
    .form-wrap { position: relative; z-index: 1; }
    .row { display: flex; gap: var(--col-gap); }
    .field { margin-bottom: 12px; flex: 1; }

    .field label {
      display: block; font-size: 0.66rem; font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 4px;
      letter-spacing: 0.01em;
      line-height: 16px; /* 2 × baseline */
    }

    .input-wrap {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
    }
    .input-wrap::before {
      content: '';
      position: absolute;
      top: 0; left: 15%; right: 15%; height: 1px;
      background: var(--clear-border);
      opacity: 0.3;
      z-index: 2; pointer-events: none;
    }

    .field input {
      width: 100%;
      height: 40px; /* 5 × baseline */
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--clear-border);
      border-top-color: var(--glass-border-top);
      border-bottom-color: var(--glass-border-bottom);
      background: var(--clear-bg);
      backdrop-filter: blur(12px) saturate(1.3);
      -webkit-backdrop-filter: blur(12px) saturate(1.3);
      box-shadow: var(--clear-shadow);
      color: var(--text);
      font-size: 0.82rem; font-family: inherit;
      outline: none; transition: all 0.25s;
    }
    .field input::placeholder { color: var(--text-tertiary); }
    .field input:focus {
      border-color: var(--focus-border);
      box-shadow: 0 0 0 3.5px var(--focus-ring), var(--clear-shadow);
    }

    /* Password */
    .pw-wrap { position: relative; }
    .pw-wrap .input-wrap input { padding-right: 40px; }
    .pw-toggle {
      position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%); z-index: 3;
      background: none; border: none;
      color: var(--text-tertiary);
      cursor: pointer; padding: 4px;
      transition: color 0.2s; display: flex;
    }
    .pw-toggle:hover { color: var(--text-secondary); }
    .pw-toggle svg { width: 14px; height: 14px; }

    .strength { display: flex; gap: 3px; margin-top: 4px; }
    .strength span {
      flex: 1; height: 2px; border-radius: 1px;
      background: var(--divider); transition: background 0.3s;
    }
    .strength span.on.s1 { background: #ef4444; }
    .strength span.on.s2 { background: #f59e0b; }
    .strength span.on.s3 { background: #10b981; }

    /* ── Terms ── */
    .terms {
      display: flex; align-items: flex-start;
      gap: 8px; margin-bottom: 16px;
    }
    .terms input[type="checkbox"] {
      appearance: none;
      width: 16px; height: 16px;
      border-radius: 5px;
      border: 1px solid var(--clear-border);
      border-top-color: var(--glass-border-top);
      border-bottom-color: var(--glass-border-bottom);
      background: var(--clear-bg);
      backdrop-filter: blur(8px);
      box-shadow: var(--clear-shadow);
      cursor: pointer; flex-shrink: 0; margin-top: 2px;
      transition: all 0.2s; position: relative;
    }
    .terms input[type="checkbox"]:checked {
      background: rgba(0,122,255,0.70);
      border-color: rgba(0,122,255,0.10);
    }
    [data-theme="dark"] .terms input[type="checkbox"]:checked {
      background: rgba(50,140,255,0.60);
    }
    .terms input[type="checkbox"]:checked::after {
      content: '';position: absolute;
      left: 4.5px; top: 1.5px;
      width: 4px; height: 8px;
      border: solid #fff;
      border-width: 0 1.5px 1.5px 0;
      transform: rotate(45deg);
    }
    .terms > span { font-size: 0.66rem; color: var(--text-secondary); line-height: 1.5; }
    .terms a { color: var(--link); text-decoration: none; }
    .terms a:hover { color: var(--link-hover); }

    /* ── Submit (active tier) ── */
    .submit {
      width: 100%;
      height: 40px; /* 5 × baseline */
      border-radius: 10px;
      border: 1px solid var(--active-border);
      background: var(--active-bg);
      backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.06),
        0 2px 6px rgba(0,0,0,0.08),
        0 10px 30px rgba(0,0,0,0.10);
      color: var(--active-text);
      font-size: 0.82rem; font-weight: 500; font-family: inherit;
      cursor: pointer; transition: all 0.25s;
      position: relative;
    }
    .submit::before {
      content: '';
      position: absolute;
      top: 0; left: 15%; right: 15%; height: 1px;
      background: rgba(255,255,255,0.10);
      pointer-events: none;
    }
    .submit:hover { filter: brightness(1.15); }
    .submit:active { transform: scale(0.98); }
    .submit span { position: relative; z-index: 1; }
    .submit.ok {
      background: rgba(16,185,129,0.75);
      border-color: rgba(16,185,129,0.15);
      pointer-events: none;
    }
    [data-theme="dark"] .submit.ok { background: rgba(16,185,129,0.35); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      :root { --margin: 16px; --col-gap: 8px; }
      .card {
        grid-column: 2 / 12 !important;
        padding: 24px 16px 16px;
      }
      .row { flex-direction: column; gap: 0; }
      .social-row { flex-direction: column; }
      .grid-col::before { display: none; }
    }

    @media (max-width: 480px) {
      .card { grid-column: 1 / -1 !important; border-radius: 0; }
    }
  </style>
</head>
<body>

  <button class="theme-toggle" aria-label="Toggle theme">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
  </button>

  <!-- Figma-style design grid + layout -->
  <div class="grid-baseline"></div>
  <div class="grid-margin-left"></div>
  <div class="grid-margin-right"></div>

  <!-- Blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div class="grid-overlay">
    <div class="grid-container" id="gridContainer">
      <!-- Card lives INSIDE the grid, spanning cols 4-9 -->
      <div class="card" style="grid-column: 4 / 10; grid-row: 1;">

    <div class="avatar-area">
      <div class="avatar" id="avatar">
        <span class="avatar-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span class="avatar-initials" id="avatarInitials"></span>
      </div>
      <span class="avatar-label" id="avatarLabel"></span>
    </div>

    <div class="header">
      <h1>Create an account</h1>
      <p>Already have one? <a href="#">Sign in</a></p>
    </div>

    <div class="social-row">
      <button class="social-btn">
        <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        <span>Google</span>
      </button>
      <button class="social-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0012 2z"/></svg>
        <span>GitHub</span>
      </button>
    </div>

    <div class="divider"><span>or</span></div>

    <form id="form" class="form-wrap" novalidate>
      <div class="row">
        <div class="field">
          <label>First name</label>
          <div class="input-wrap">
            <input type="text" id="fn" placeholder="Ada" autocomplete="given-name">
          </div>
        </div>
        <div class="field">
          <label>Last name</label>
          <div class="input-wrap">
            <input type="text" id="ln" placeholder="Lovelace" autocomplete="family-name">
          </div>
        </div>
      </div>

      <div class="field">
        <label>Email</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="ada@example.com" autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="pw-wrap">
          <div class="input-wrap">
            <input type="password" id="pw" placeholder="Min. 8 characters" autocomplete="new-password">
          </div>
          <button type="button" class="pw-toggle" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="strength">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>

      <label class="terms">
        <input type="checkbox" id="tos">
        <span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></span>
      </label>

      <button type="submit" class="submit">
        <span>Create account</span>
      </button>
    </form>
      </div><!-- .card -->
    </div><!-- .grid-container -->
  </div><!-- .grid-overlay -->

  <script>
    // Generate 12 grid columns as visual overlays
    // They share the same grid and sit behind the card
    const gc = document.getElementById('gridContainer');
    const card = gc.querySelector('.card');
    for (let i = 1; i <= 12; i++) {
      const col = document.createElement('div');
      col.className = 'grid-col';
      col.dataset.col = i;
      col.style.gridColumn = i;
      col.style.gridRow = '1';
      // Insert columns before the card so card renders on top
      gc.insertBefore(col, card);
    }

    // Theme
    document.querySelector('.theme-toggle').addEventListener('click', () => {
      const h = document.documentElement;
      h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
    });

    // Avatar
    const fnI = document.getElementById('fn');
    const lnI = document.getElementById('ln');
    const av = document.getElementById('avatar');
    const avI = document.getElementById('avatarInitials');
    const avL = document.getElementById('avatarLabel');

    function updateAvatar() {
      const f = fnI.value.trim(), l = lnI.value.trim();
      const ini = (f ? f[0] : '').toUpperCase() + (l ? l[0] : '').toUpperCase();
      avI.textContent = ini;
      if (ini) {
        av.classList.add('has-initials');
        avL.textContent = [f, l].filter(Boolean).join(' ');
        avL.classList.add('active');
      } else {
        av.classList.remove('has-initials');
        avL.textContent = '';
        avL.classList.remove('active');
      }
    }
    fnI.addEventListener('input', updateAvatar);
    lnI.addEventListener('input', updateAvatar);

    // Password toggle
    const pw = document.getElementById('pw');
    const tog = document.querySelector('.pw-toggle');
    tog.addEventListener('click', () => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      tog.innerHTML = show
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    });

    // Strength
    const segs = document.querySelectorAll('.strength span');
    pw.addEventListener('input', () => {
      const v = pw.value; let s = 0;
      if (v.length >= 4) s++;
      if (v.length >= 8) s++;
      if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++;
      if (/[^a-zA-Z0-9]/.test(v)) s++;
      const c = s <= 1 ? 's1' : s <= 2 ? 's2' : 's3';
      segs.forEach((el, i) => { el.className = i < s ? 'on ' + c : ''; });
    });

    // Submit
    const form = document.getElementById('form');
    const btn = form.querySelector('.submit');
    form.addEventListener('submit', e => {
      e.preventDefault();
      const ok = fnI.value.trim()
        && document.getElementById('email').value.trim()
        && pw.value.length >= 8
        && document.getElementById('tos').checked;
      if (!ok) {
        btn.style.animation = 'shake .35s ease';
        btn.addEventListener('animationend', () => btn.style.animation = '', { once: true });
        return;
      }
      btn.classList.add('ok');
      btn.querySelector('span').textContent = 'Welcome!';
    });

    const sk = document.createElement('style');
    sk.textContent = '@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}';
    document.head.appendChild(sk);
  </script>

</body>
</html>
